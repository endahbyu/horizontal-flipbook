name: Deploy Flipbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the generated manifest aligned with the committed page images.
      - name: Generate page manifest
        run: node tools/scan-pages.js

      # Build-only tools (sharp compresses images for the downloads).
      - name: Install build tools
        run: npm ci

      # One self-contained HTML per book, for the reader's "Download flipbook".
      - name: Build standalone downloads
        run: node tools/build-standalone.js

      # GitHub Pages serves this as a static site; the local Express server is
      # not needed in the deployed artifact.
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r assets css js downloads *.html sw.js manifest.webmanifest _site/
          # New cache name per deploy, so readers pick up updates.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
