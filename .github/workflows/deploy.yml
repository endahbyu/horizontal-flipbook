name: Deploy Flipbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the generated manifest aligned with the committed page images.
      - name: Generate page manifest
        run: node tools/scan-pages.js

      # GitHub Pages serves this as a static site; the local Express server is
      # not needed in the deployed artifact.
      # The particle landing page (landing/, a Nuxt app) is built into read/,
      # next to strategy.html. Its base path is the Pages project path + read/.
      - name: Build particle landing page
        working-directory: landing
        run: |
          npm ci
          NUXT_APP_BASE_URL="/${GITHUB_REPOSITORY#*/}/read/" \
          NUXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io" \
          npx nuxt generate

      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r assets css js *.html sw.js manifest.webmanifest _site/
          cp -rL landing/.output/public _site/read
          # New cache name per deploy, so readers pick up updates.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The publish step sometimes starts before GitHub has registered the
      # upload ("No artifacts named github-pages were found"): give it a
      # moment, and if it still fails, wait and try once more.
      - name: Let the upload register
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
