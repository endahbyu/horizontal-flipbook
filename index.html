<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9e5dc" />
    <meta name="description" content="Interactive licensing report — turn, inspect, and browse every page." />
    <title>Licensing 2025 — Interactive Report</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Progress bar (mobile only, pinned to the very top) — visibility of status -->
    <div class="progress" id="progress" aria-label="Reading progress">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="book-stage" id="stage">
      <button class="arrow" id="prev" aria-label="Previous page">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" /></svg>
      </button>

      <div class="book-viewport" id="viewport">
        <div id="book"></div>
      </div>

      <button class="arrow" id="next" aria-label="Next page">
        <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" /></svg>
      </button>
    </div>

    <p class="meta"><b id="readout">01 — 10</b><span id="caption">Cover</span></p>

    <!-- Navigation icons (bottom) -->
    <div class="toolbar" role="toolbar" aria-label="Book controls">
      <button class="tb-btn" id="tocBtn" aria-label="Table of contents" title="Table of contents">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <button class="tb-btn" id="thumbBtn" aria-label="Thumbnails" title="Thumbnails">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" /><rect x="13" y="4" width="7" height="7" /><rect x="4" y="13" width="7" height="7" /><rect x="13" y="13" width="7" height="7" /></svg>
      </button>

      <span class="tb-sep"></span>

      <button class="tb-btn" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
      <output class="tb-readout" id="zoomReadout">100%</output>
      <button class="tb-btn" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>

      <span class="tb-sep"></span>

      <button class="tb-btn" id="fullscreenBtn" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </div>

    <p class="hint">Drag a page corner to turn · ← → keys · +/− zoom · F fullscreen</p>

    <!-- Overlay + panels -->
    <div class="overlay" id="overlay"></div>

    <aside class="panel" id="tocPanel" aria-label="Table of contents">
      <div class="panel-head">
        <span>Table of Contents</span>
        <button class="panel-close" data-close>✕</button>
      </div>
      <ul class="toc-list" id="tocList"></ul>
    </aside>

    <aside class="panel panel-wide" id="thumbPanel" aria-label="Thumbnails">
      <div class="panel-head">
        <span>All Pages</span>
        <button class="panel-close" data-close>✕</button>
      </div>
      <div class="thumb-grid" id="thumbGrid"></div>
    </aside>

    <script src="js/vendor/page-flip.browser.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
