<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CONTENT REPLACEMENT: BRAND TOKEN — verified P2630 primary navy. -->
    <meta name="theme-color" content="#172983" />
    <meta
      name="description"
      content="MCMC Plan 2026–2030 (MCMC P2630) — explore the Strategy Plan interactively."

    <!-- CONTENT REPLACEMENT: TYPOGRAPHY — Host Grotesk / Inter font asset requirement. -->
    <link rel="stylesheet" href="css/fonts.css" />

  <body>
    <noscript>
      <div class="script-warning">
        Interactive mode requires JavaScript. Please enable it to browse the Strategy Plan.
      </div>
    </noscript>
    <div class="wash" aria-hidden="true"></div>

    <header class="masthead">
      <!-- CONTENT REPLACEMENT: BRAND — MCMC P2630 wordmark. -->
      <!-- CONTENT REPLACEMENT: LOGO — replace fallback wordmark when approved logo asset is supplied. -->
      <a class="brand" href="#flipbook">MCMC <em>P2630</em></a>
      <nav aria-label="Primary navigation">
        <a href="#flipbook" aria-current="page">Strategy Plan</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="flipbook" aria-labelledby="report-title">
        <div class="hero-copy">
          <!-- CONTENT REPLACEMENT: COPYWRITING — MCMC PLAN 2026–2030 eyebrow. -->
          <p class="eyebrow">MCMC PLAN 2026–2030</p>
          <!-- CONTENT REPLACEMENT: COPYWRITING — Advancing Inclusivity headline. -->
          <h1 id="report-title">Advancing <i>Inclusivity</i></h1>
        </div>

        <div class="book-wrap" id="bookWrap">
          <div class="stage" id="stage">
            <button class="page-arrow left" id="prevButton" aria-label="Previous page">
              <svg viewBox="0 0 20 54" aria-hidden="true"><path d="M16 3 4 27l12 24" /></svg>
            </button>

            <div class="book-frame" id="bookFrame">
              <div id="book" aria-live="polite"></div>
            </div>

            <button class="page-arrow right" id="nextButton" aria-label="Next page">
              <svg viewBox="0 0 20 54" aria-hidden="true"><path d="m4 3 12 24L4 51" /></svg>
            </button>
          </div>

          <div class="book-meta">
            <p class="page-readout" id="pageReadout">01 / 12</p>
          </div>

          <div class="toolbar" role="group" aria-label="Book controls">
            <button id="tocButton" aria-label="Open table of contents" aria-haspopup="dialog" aria-expanded="false" aria-controls="tocPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h10"></path>
              </svg>
            </button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button id="zoomOut" aria-label="Zoom out">−</button>
            <output id="zoomReadout" aria-label="Current zoom">100%</output>
            <button id="zoomIn" aria-label="Zoom in">+</button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button id="fullscreenButton" aria-label="Enter fullscreen" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-expand">
                <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"></path>
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-collapse">
                <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"></path>
              </svg>
            </button>
          </div>

          <p class="hint" id="hint">Drag a page corner to turn · use ← → keys · +/− zoom · F fullscreen</p>
        </div>

        <div class="toc-backdrop" id="tocBackdrop" hidden></div>
        <div class="toc-panel" id="tocPanel" role="dialog" aria-modal="true" aria-labelledby="tocPanelTitle" hidden>
          <div class="toc-panel-header">
            <h3 id="tocPanelTitle">Table of contents</h3>
            <button type="button" class="toc-close" id="tocClose" aria-label="Close table of contents">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
          </div>
          <ol class="toc-list" id="tocList"></ol>
        </div>
      </section>
    </main>

    <footer>
      <!-- CONTENT REPLACEMENT: BRAND — MCMC publisher. -->
      <span>Malaysian Communications and Multimedia Commission</span>
      <!-- CONTENT REPLACEMENT: BRAND — MCMC Plan 2026–2030 edition. -->
      <span>MCMC Plan 2026–2030 · MCMC P2630</span>
    </footer>

    <script src="js/vendor/page-flip.browser.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/main.js"></script>
